<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>thuperman</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

.stage {
    position: relative;
    width: 100vw;
    height: 100svh;
    min-height: 100dvh;

    overflow: hidden;
    display: grid;
    place-items: center;

    background: #000;
    isolation: isolate;
}


/* ==============================
   BACKGROUND VIDEO
============================== */

#catVideo {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: -3;
    pointer-events: none;
}

.video-overlay {
    position: absolute;
    inset: 0;

    z-index: -2;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 0, 0, 0.08),
            rgba(0, 0, 0, 0.52)
        ),
        rgba(0, 0, 0, 0.12);
}


/* ==============================
   CONTENT
============================== */

.content {
    position: relative;
    z-index: 3;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}


/* ==============================
   CORNER CATS
============================== */

.corner-cat {
    position: absolute;

    width: 120px;
    height: 120px;

    object-fit: contain;

    z-index: 5;

    pointer-events: none;

    filter:
        drop-shadow(0 0 5px #fff)
        drop-shadow(0 0 12px #ff00e6)
        drop-shadow(0 0 25px #00ffff)
        drop-shadow(0 0 40px #008cff);
}

.cat-tl {
    top: 7%;
    left: 7%;
}

.cat-tr {
    top: 7%;
    right: 7%;
}

.cat-bl {
    bottom: 7%;
    left: 7%;
}

.cat-br {
    bottom: 7%;
    right: 7%;
}


/* ==============================
   TAP FOR AUDIO
============================== */

.audio-hint {
    position: absolute;

    left: 50%;
    bottom: 22px;

    transform: translateX(-50%);

    z-index: 20;

    color: rgba(255, 255, 255, 0.78);

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 2px;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ff00e6,
        0 0 20px #00ffff;

    white-space: nowrap;

    pointer-events: none;

    animation: audioPulse 1.8s ease-in-out infinite;
}

@keyframes audioPulse {
    0%, 100% {
        opacity: 0.45;
    }

    50% {
        opacity: 1;
    }
}


/* ==============================
   SCANLINES
============================== */

.scanlines {
    position: absolute;
    inset: 0;

    z-index: 10;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,0.018) 4px
        );

    mix-blend-mode: screen;
}


/* ==============================
   ANIMATIONS
============================== */

@keyframes rgb {

    0%, 100% {
        filter: hue-rotate(0deg);
    }

    50% {
        filter: hue-rotate(180deg);
    }
}

@keyframes pulse {

    from {
        transform: scale(0.985);
    }

    to {
        transform: scale(1.015);
    }
}

@keyframes red {

    0%, 100% {
        transform: translate(-5px, 0);
    }

    50% {
        transform: translate(-11px, 2px);
    }
}

@keyframes cyan {

    0%, 100% {
        transform: translate(5px, 0);
    }

    50% {
        transform: translate(11px, -2px);
    }
}


/* ==============================
   MOBILE
============================== */

@media (max-width: 600px) {

    .corner-cat {
        width: 75px;
        height: 75px;
    }

    .cat-tl {
        top: 6%;
        left: 6%;
    }

    .cat-tr {
        top: 6%;
        right: 6%;
    }

    .cat-bl {
        bottom: 6%;
        left: 6%;
    }

    .cat-br {
        bottom: 6%;
        right: 6%;
    }

    .word {
        font-size: clamp(1.8rem, 8vw, 5rem);
    }

    .audio-hint {
        bottom: 16px;
        font-size: 10px;
    }
}


/* Reduced motion */

@media (prefers-reduced-motion: reduce) {

    .word,
    .word::before,
    .word::after,
    .audio-hint {
        animation: none;
    }
}

</style>
</head>


<body>

<main class="stage">

    <!-- FULLSCREEN CAT VIDEO -->
    <video
        id="catVideo"
        src="spinning-cat.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto">
    </video>


    <!-- VIDEO DARK OVERLAY -->
    <div class="video-overlay"></div>


    <!-- MAIN CONTENT -->
    <section class="content">

        <!-- TOP LEFT -->
        <img
            class="corner-cat cat-tl"
            src="cute-cat.gif"
            alt="Dancing cat">


        <!-- TOP RIGHT -->
        <img
            class="corner-cat cat-tr"
            src="cute-cat.gif"
            alt="Dancing cat">


        <!-- BOTTOM LEFT -->
        <img
            class="corner-cat cat-bl"
            src="cute-cat.gif"
            alt="Dancing cat">


        <!-- BOTTOM RIGHT -->
        <img
            class="corner-cat cat-br"
            src="cute-cat.gif"
            alt="Dancing cat">


    </section>


    <!-- AUDIO MESSAGE -->
    <div class="audio-hint">
        tap for audio
    </div>


    <!-- CRT SCANLINES -->
    <div class="scanlines"></div>

</main>


<script>

const video = document.getElementById("catVideo");
const audioHint = document.querySelector(".audio-hint");


// Start muted because browsers block
// autoplay with sound
video.muted = true;
video.volume = 1;

video.play().catch(() => {});


/* ==============================
   ENABLE AUDIO
============================== */

async function turnSoundOn() {

    video.muted = false;
    video.volume = 1;

    try {

        await video.play();

        audioHint.textContent = "audio on";

        audioHint.style.transition = "opacity 0.4s ease";
        audioHint.style.opacity = "0";

        setTimeout(() => {
            audioHint.style.display = "none";
        }, 450);

    } catch (error) {

        video.muted = true;

    }
}


/* Click anywhere */

document.addEventListener(
    "click",
    turnSoundOn,
    { once: true }
);


/* Touch anywhere */

document.addEventListener(
    "touchstart",
    turnSoundOn,
    {
        once: true,
        passive: true
    }
);

</script>

</body>
</html>
