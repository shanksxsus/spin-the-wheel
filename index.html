<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>thuperman</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: #000;
    display: grid;
    place-items: center;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100svh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 50% 50%, #080808 0%, #020202 42%, #000 72%);
  }

  /* Huge soft RGB aura behind the word */
  .stage::before {
    content: "";
    position: absolute;
    width: min(75vw, 850px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #ff003c,
      #ff00ea,
      #6a00ff,
      #00b7ff,
      #00ffd5,
      #00ff3c,
      #fff000,
      #ff003c
    );
    filter: blur(100px);
    opacity: .18;
    animation: aura 5s linear infinite;
    z-index: -2;
  }

  .stage::after {
    content: "";
    position: absolute;
    inset: -20%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(255,0,80,.04) 45deg,
      transparent 90deg,
      rgba(0,180,255,.04) 180deg,
      transparent 230deg,
      rgba(0,255,120,.04) 315deg,
      transparent 360deg
    );
    animation: spin 14s linear infinite;
    z-index: -1;
  }

  .word {
    position: relative;
    margin: 0;
    padding: 0 .08em;
    color: #fff;
    font-size: clamp(2rem, 9vw, 8rem);
    line-height: .9;
    font-weight: 900;
    letter-spacing: -.075em;
    white-space: nowrap;
    max-width: 96vw;
    overflow: visible;
    user-select: none;
    text-align: center;

    /* RGB separation + insane glow */
    text-shadow:
      0 0 3px #fff,
      0 0 8px #fff,
      0 0 18px #ff0055,
      0 0 34px #ff0055,
      0 0 58px #ff00e6,
      0 0 90px #6a00ff,
      0 0 130px #00bfff,
      -8px 0 0 rgba(255,0,55,.8),
      8px 0 0 rgba(0,255,255,.8);

    animation: rgb 2.8s linear infinite, pulse 1.7s ease-in-out infinite alternate;
  }

  .reveal-button {
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    font: inherit;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    color: #fff;
  }

  .reveal-button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 10px;
  }

  .reveal-button.revealed {
    cursor: default;
  }


  /* Chromatic ghost layers */
  .word::before,
  .word::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    pointer-events: none;
    color: transparent;
    -webkit-text-stroke: 2px;
    opacity: .8;
  }

  .word::before {
    -webkit-text-stroke-color: #ff0055;
    transform: translate(-6px, 0);
    filter: blur(1px);
    animation: red 1.2s steps(2, end) infinite;
  }

  .word::after {
    -webkit-text-stroke-color: #00ffff;
    transform: translate(6px, 0);
    filter: blur(1px);
    animation: cyan .9s steps(2, end) infinite;
  }

  /* Subtle CRT scanlines */
  .spinning-cat {
    position: absolute;
    width: clamp(150px, 18vw, 230px);
    height: auto;
    left: 50%;
    top: calc(50% + clamp(85px, 8vw, 120px));
    transform: translateX(-50%);
    border: 0;
    outline: 0;
    filter:
      drop-shadow(0 0 8px #fff)
      drop-shadow(0 0 22px #ff00e6)
      drop-shadow(0 0 38px #00ffff);
    z-index: 3;
    pointer-events: none;
  }

  .left-cat { left: 1.5%; }
  .right-cat {
    right: 1.5%;
    transform: scaleX(-1);
  }

  @media (max-width: 600px) {
    .top-cat {
      top: calc(50% - 135px);
      width: 90px;
    }



    .stage::before {
      width: 100vw;
      filter: blur(70px);
      opacity: .2;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .word, .word::before, .word::after,
    .stage::before, .stage::after {
      animation: none;
    }
  }
</style>
</head>
<body>
  <main class="stage">
    
    <img class="top-cat" src="cute-cat.gif" alt="Dancing cat">
    <h1 class="word" data-text="Chutiya Unpaid villain/Ray">Chutiya Unpaid villain/Ray</h1>
    <div class="scanlines"></div>
  
    
    <video id="catVideo" class="spinning-cat" src="spinning-cat.mp4" autoplay muted loop playsinline preload="auto"></video>
  <button id="soundPrompt" type="button" aria-label="Enable sound">TAP FOR SOUND</button>
  </main>



<script>
  (() => {
    const video = document.getElementById("catVideo");
    const prompt = document.getElementById("soundPrompt");
    if (!video) return;

    // Autoplay is allowed while muted.
    video.muted = true;
    video.volume = 1;
    video.play().catch(() => {});

    async function enableSound() {
      video.muted = false;
      video.volume = 1;

      try {
        await video.play();
        if (prompt) prompt.classList.add("hidden");
      } catch (err) {
        // Keep the prompt visible if the browser refuses audio.
      }
    }

    if (prompt) {
      prompt.addEventListener("click", enableSound);
    }

    // Also allow the first interaction anywhere to enable audio.
    document.addEventListener("click", (event) => {
      if (event.target === prompt) return;
      if (!video.muted) return;
      enableSound();
    }, { once: true });

    document.addEventListener("touchstart", () => {
      if (video.muted) enableSound();
    }, { once: true, passive: true });
  })();
</script>

</body>
</html>
