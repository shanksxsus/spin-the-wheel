<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>thuperman</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   MAIN SCREEN
========================= */

.stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    display: grid;
    place-items: center;

    background: #000;
    isolation: isolate;
}

/* =========================
   BACKGROUND CAT VIDEO
========================= */

#catVideo {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: -3;
    pointer-events: none;
}

/* Darken video slightly */
.video-overlay {
    position: absolute;
    inset: 0;

    z-index: -2;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 0, 0, 0.05),
            rgba(0, 0, 0, 0.55)
        ),
        rgba(0, 0, 0, 0.15);
}

/* =========================
   CONTENT
========================= */

.content {
    position: relative;
    z-index: 3;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

/* =========================
   FOUR CORNER CATS
========================= */

.corner-cat {
    position: absolute;

    width: 120px;
    height: 120px;

    object-fit: contain;

    z-index: 5;

    pointer-events: none;

    filter:
        drop-shadow(0 0 5px #fff)
        drop-shadow(0 0 12px #ff00e6)
        drop-shadow(0 0 25px #00ffff)
        drop-shadow(0 0 40px #008cff);
}

/* Top left */
.cat-tl {
    top: 7%;
    left: 7%;
}

/* Top right */
.cat-tr {
    top: 7%;
    right: 7%;
}

/* Bottom left */
.cat-bl {
    bottom: 7%;
    left: 7%;
}

/* Bottom right */
.cat-br {
    bottom: 7%;
    right: 7%;
}

/* =========================
   MAIN TEXT
========================= */

.word {
    position: relative;

    margin: 0;

    color: white;

    font-size: clamp(2rem, 9vw, 8rem);

    line-height: 0.9;

    font-weight: 900;

    letter-spacing: -0.075em;

    white-space: nowrap;

    max-width: 96vw;

    text-align: center;

    user-select: none;

    /* RGB glow */
    text-shadow:
        0 0 3px #fff,
        0 0 8px #fff,

        0 0 18px #ff0055,
        0 0 34px #ff0055,

        0 0 58px #ff00e6,

        0 0 90px #6a00ff,

        0 0 130px #00bfff,

        -8px 0 0 rgba(255, 0, 55, 0.85),
        8px 0 0 rgba(0, 255, 255, 0.85);

    animation:
        rgb 2.8s linear infinite,
        pulse 1.7s ease-in-out infinite alternate;
}

/* =========================
   RGB GLITCH LAYERS
========================= */

.word::before,
.word::after {
    content: attr(data-text);

    position: absolute;
    inset: 0;

    pointer-events: none;

    color: transparent;

    -webkit-text-stroke: 2px;

    opacity: 0.8;
}

/* RED OFFSET */

.word::before {
    -webkit-text-stroke-color: #ff0055;

    transform: translate(-6px, 0);

    filter: blur(1px);

    animation: red 1.2s steps(2, end) infinite;
}

/* CYAN OFFSET */

.word::after {
    -webkit-text-stroke-color: #00ffff;

    transform: translate(6px, 0);

    filter: blur(1px);

    animation: cyan 0.9s steps(2, end) infinite;
}

/* =========================
   SCANLINES
========================= */

.scanlines {
    position: absolute;
    inset: 0;

    z-index: 10;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,0.018) 4px
        );

    mix-blend-mode: screen;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes rgb {

    0%,
    100% {
        filter: hue-rotate(0deg);
    }

    50% {
        filter: hue-rotate(180deg);
    }
}

@keyframes pulse {

    from {
        transform: scale(0.985);
    }

    to {
        transform: scale(1.015);
    }
}

@keyframes red {

    0%,
    100% {
        transform: translate(-5px, 0);
    }

    50% {
        transform: translate(-11px, 2px);
    }
}

@keyframes cyan {

    0%,
    100% {
        transform: translate(5px, 0);
    }

    50% {
        transform: translate(11px, -2px);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .corner-cat {
        width: 75px;
        height: 75px;
    }

    .cat-tl {
        top: 6%;
        left: 6%;
    }

    .cat-tr {
        top: 6%;
        right: 6%;
    }

    .cat-bl {
        bottom: 6%;
        left: 6%;
    }

    .cat-br {
        bottom: 6%;
        right: 6%;
    }

    .word {
        font-size: clamp(1.8rem, 8vw, 5rem);
    }
}

</style>
</head>

<body>

<main class="stage">

    <!-- FULL SCREEN CAT VIDEO -->
    <video
        id="catVideo"
        src="spinning-cat.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto">
    </video>

    <!-- DARK OVERLAY -->
    <div class="video-overlay"></div>


    <!-- MAIN CONTENT -->
    <section class="content">

        <!-- FOUR CATS -->

        <img
            class="corner-cat cat-tl"
            src="cute-cat.gif"
            alt="Cat">

        <img
            class="corner-cat cat-tr"
            src="cute-cat.gif"
            alt="Cat">

        <img
            class="corner-cat cat-bl"
            src="cute-cat.gif"
            alt="Cat">

        <img
            class="corner-cat cat-br"
            src="cute-cat.gif"
            alt="Cat">


        <!-- MAIN TEXT -->

        <h1
            class="word"
            data-text="Chutiya Unpaid villain/Ray">
            Chutiya Unpaid villain/Ray
        </h1>

    </section>


    <!-- CRT SCANLINES -->
    <div class="scanlines"></div>

</main>

</body>
</html>
